# Default configuration. CLI flags override values from this file.

model:
  # Official Ultralytics checkpoints (yolo11n.pt, yolo11s.pt, ...) are downloaded
  # automatically. Point this to custom weights to use your own fruit detector.
  weights: models/yolo11n.pt
  # "auto", "cpu", "cuda:0", "mps"
  device: auto
  image_size: 640
  confidence: 0.25
  # NMS IoU threshold.
  iou: 0.45
  # Class names to keep. COCO only has these three fruit classes.
  # Use [] to keep every class of a custom fruit-only model.
  classes: [apple, banana, orange]
  # FP16 inference, CUDA only.
  half: false

tracking:
  # Only detections at or above this confidence can start a new track.
  high_threshold: 0.5
  # Minimum IoU between a predicted track box and a detection.
  match_iou: 0.3
  # Consecutive matched frames before a fruit is counted.
  min_hits: 3
  # Frames a counted fruit may go undetected before its track is dropped.
  max_age: 30

video:
  # Process every N-th frame.
  frame_stride: 1
  # Stop after N processed frames (null = whole video).
  max_frames: null

output:
  directory: outputs
  save_annotated: true
