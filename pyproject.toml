[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-detection-counting"
version = "0.1.0"
description = "Fruit detection and counting in images and videos with YOLO."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "felipebridge" }]
keywords = ["computer-vision", "object-detection", "yolo", "fruit-counting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
fruit-counter = "fruit_counter.cli:main"

[project.urls]
Repository = "https://github.com/felipebridge/fruit-detection-counting"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: runs real YOLO inference (needs ultralytics and model weights)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*", "torch", "torch.*", "cv2", "cv2.*"]
follow_imports = "skip"
